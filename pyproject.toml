[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-sanitizer"
version = "0.1.0"
description = "Escáner de corpus RAG antes de la ingestión: detecta documentos poison (semantic mimicry, entity-swap, visual poison) y los marca/quarantina antes de chunk+embed."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
keywords = ["rag", "poisoning", "security", "corpus", "ingestion", "llm-security", "agpl"]
dependencies = ["typer>=0.12", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "bandit>=1.7"]
real-embeddings = ["sentence-transformers>=2.5"]
multimodal = ["pillow>=10.0", "imagehash>=4.3"]

[project.scripts]
rag-sanitizer = "rag_sanitizer.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
